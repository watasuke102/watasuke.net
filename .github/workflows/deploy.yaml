name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [contents-updated]

permissions:
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Notify server to renew contents
        env:
          RENEW_NOTIFICATION_ENDPOINT: ${{ secrets.RENEW_NOTIFICATION_ENDPOINT }}
        run: |
          TOKEN=$(curl -sS -G\
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$RENEW_NOTIFICATION_ENDPOINT" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" $RENEW_NOTIFICATION_ENDPOINT

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ hashFiles('**/package-lock.json') }}

      - name: Ensure rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CONFIG_TS: ${{ secrets.CONFIG_TS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          npm install
          echo "$CONFIG_TS" > config/config.ts

      - name: Rsync deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          RSYNC_RSH="ssh -p ${DEPLOY_PORT:-22} -o StrictHostKeyChecking=yes -i ~/.ssh/id_rsa"
          rsync -az --progress --checksum --delete -e "$RSYNC_RSH" "main/out/" "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"
